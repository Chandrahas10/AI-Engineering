<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Resume Evaluator — Candidate & HR</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1050px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 1.75rem; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea, select, input[type="file"] {
      width: 100%; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); padding: 10px;
    }
    textarea { min-height: 130px; resize: vertical; }

    .row { display: grid; grid-template-columns: 1fr 220px; gap: 16px; margin-top: 16px; }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }

    .submit-btn {
      margin-top: 18px; padding: 12px 22px; border: none; border-radius: 8px;
      background: var(--accent-2); color: #052e16; font-weight: 700; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; background: #0f172a; border: 1px solid var(--border);
    }
    .score-big { font-size: 2rem; font-weight: 800; color: var(--accent); }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pill { background: #0f172a; border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; }
    .error { color: #fca5a5; background: #450a0a; border: 1px solid var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Resume Evaluator</h1>
    <p class="subtitle">Score single resumes for candidates or rank a full folder of PDFs for HR.</p>

    <div class="tabs">
      <button id="tab-candidate" class="tab-btn active" onclick="switchMode('candidate')">Candidate Mode</button>
      <button id="tab-hr" class="tab-btn" onclick="switchMode('hr')">HR Bulk Ranking Mode</button>
    </div>

    <div id="error-box" class="error hidden"></div>

    <form id="eval-form" class="card">
      <label for="jd-input">Job Description (JD)</label>
      <textarea id="jd-input" placeholder="Paste the job description, required skills, experience, and qualifications..." required></textarea>

      <!-- Candidate Upload -->
      <div id="candidate-fields" class="row">
        <div>
          <label for="single-resume">Upload Your Resume (PDF)</label>
          <input id="single-resume" type="file" accept=".pdf,application/pdf" />
        </div>
      </div>

      <!-- HR Folder/Multi-PDF Upload + Top N -->
      <div id="hr-fields" class="row hidden">
        <div>
          <label for="folder-resumes">Upload Resume Folder or Multiple PDFs</label>
          <input id="folder-resumes" type="file" accept=".pdf,application/pdf" multiple webkitdirectory directory />
          <small style="color: var(--muted);">Selects all PDFs inside the chosen folder.</small>
        </div>
        <div>
          <label for="top-n">Shortlist Top N</label>
          <select id="top-n">
            <option value="5">Top 5</option>
            <option value="10" selected>Top 10</option>
            <option value="20">Top 20</option>
            <option value="50">Top 50</option>
            <option value="all">All Resumes</option>
          </select>
        </div>
      </div>

      <button id="submit-btn" class="submit-btn" type="submit">Analyze Resume</button>
    </form>

    <div id="results-area" class="card hidden"></div>
  </div>

  <script>
    let currentMode = "candidate";

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("tab-candidate").classList.toggle("active", mode === "candidate");
      document.getElementById("tab-hr").classList.toggle("active", mode === "hr");
      document.getElementById("candidate-fields").classList.toggle("hidden", mode !== "candidate");
      document.getElementById("hr-fields").classList.toggle("hidden", mode !== "hr");
      document.getElementById("submit-btn").textContent =
        mode === "candidate" ? "Get Score & Verdict" : "Rank Resumes";
      document.getElementById("results-area").classList.add("hidden");
      hideError();
    }

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.classList.remove("hidden");
    }

    function hideError() {
      document.getElementById("error-box").classList.add("hidden");
    }

    document.getElementById("eval-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const jdText = document.getElementById("jd-input").value.trim();
      const btn = document.getElementById("submit-btn");
      const resultsArea = document.getElementById("results-area");

      if (!jdText) {
        showError("Please enter a Job Description.");
        return;
      }

      const formData = new FormData();
      formData.append("jd_text", jdText);

      let endpoint = "/api/candidate/evaluate";

      if (currentMode === "candidate") {
        const fileInput = document.getElementById("single-resume");
        if (!fileInput.files.length) {
          showError("Please select a PDF resume.");
          return;
        }
        formData.append("resume", fileInput.files[0]);
      } else {
        endpoint = "/api/hr/rank";
        const folderInput = document.getElementById("folder-resumes");
        const pdfs = Array.from(folderInput.files || []).filter((f) =>
          f.name.toLowerCase().endsWith(".pdf")
        );
        if (!pdfs.length) {
          showError("No PDF files found in the selected folder.");
          return;
        }
        for (const pdf of pdfs) {
          formData.append("resumes", pdf);
        }
        formData.append("top_n", document.getElementById("top-n").value);
      }

      btn.disabled = true;
      btn.textContent = currentMode === "candidate" ? "Evaluating..." : "Scoring & Ranking Resumes...";
      resultsArea.classList.add("hidden");

      try {
        const res = await fetch(endpoint, { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Request failed.");
        }
        if (currentMode === "candidate") {
          renderCandidateResult(data);
        } else {
          renderHrResults(data);
        }
        resultsArea.classList.remove("hidden");
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = currentMode === "candidate" ? "Get Score & Verdict" : "Rank Resumes";
      }
    });

    function renderCandidateResult(data) {
      const matched = (data.matched_skills || []).map((s) => `<span class="pill">${s}</span>`).join("");
      const missing = (data.missing_skills || []).map((s) => `<span class="pill">${s}</span>`).join("");
      const takeaways = (data.key_takeaways || []).map((t) => `<li>${t}</li>`).join("");

      document.getElementById("results-area").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <h2 style="margin:0;">${data.candidate_name}</h2>
            <small style="color:var(--muted);">${data.file_name}</small>
          </div>
          <div style="text-align:right;">
            <div class="score-big">${data.score} / 100</div>
            <span class="badge">${data.verdict}</span>
          </div>
        </div>
        <p style="margin-top:14px; line-height:1.5;">${data.summary}</p>
        <div class="row">
          <div>
            <strong>Matched Skills</strong>
            <div class="pill-list">${matched || "<span class='pill'>None listed</span>"}</div>
          </div>
          <div>
            <strong>Missing / Skill Gaps</strong>
            <div class="pill-list">${missing || "<span class='pill'>None listed</span>"}</div>
          </div>
        </div>
        <div style="margin-top:16px;">
          <strong>Key Verdict & Takeaways</strong>
          <ul>${takeaways}</ul>
        </div>
      `;
    }

    function renderHrResults(data) {
      const rows = (data.shortlist || [])
        .map(
          (item, idx) => `
          <tr>
            <td><strong>#${idx + 1}</strong></td>
            <td>
              <strong>${item.candidate_name}</strong><br/>
              <small style="color:var(--muted);">${item.file_name}</small>
            </td>
            <td><strong>${item.score}</strong> / 100</td>
            <td><span class="badge">${item.verdict}</span></td>
            <td>${item.summary}</td>
          </tr>
        `
        )
        .join("");

      document.getElementById("results-area").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <h2 style="margin:0;">HR Shortlist (Sorted Descending)</h2>
          <span class="badge">Showing Top ${data.shortlist_count} of ${data.total_processed} Resumes</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Candidate</th>
              <th>Score</th>
              <th>Verdict</th>
              <th>Verdict Summary</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
